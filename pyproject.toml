[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeagent-v2"
version = "2.0.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pandas>=2.2,<4",
  "numpy>=2,<3",
  "python-dotenv>=1,<2",
  "requests>=2.31,<3",
  "httpx>=0.27,<1",
  "tenacity>=9,<10",
  "python-multipart>=0.0.20,<1",
  "psutil>=5.9,<8",
  "websockets>=12,<16",
  "ollama>=0.4,<1",
]

[project.optional-dependencies]
broker = [
  "ctrader-open-api==0.9.2",
  "service-identity>=24,<25",
]
research = [
  "plotly>=6,<7",
  "kaleido>=1,<2",
  "ta>=0.11,<1",
  "vectorbt>=0.28,<1; python_version < '3.14'",
  "beautifulsoup4>=4.12,<5",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
